name: Prepare prediction calibration

on:
  workflow_dispatch:
    inputs:
      authorize_database_writes:
        description: Authorize the cache migration and calibration profile writes on the configured database
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-prediction-calibration
  cancel-in-progress: false

jobs:
  prepare:
    # Publication never implies permission to migrate or warm the operational database.
    if: github.event_name == 'workflow_dispatch' && inputs.authorize_database_writes == true && vars.OPERATIONAL_CALIBRATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Rome
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      PLAYER_DATA_ENABLED: 'false'
      PLAYER_AVAILABILITY_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Prepare and verify live and recent replay profiles
        run: npm run calibration:warm
