name: Nightly Sync
run-name: Nightly Sync (${{ github.event.schedule || 'manual' }})

on:
  schedule:
    # Off-peak primary and two recovery opportunities; GitHub is not a real-time scheduler.
    - cron: '7 3 * * *'
      timezone: Europe/Rome
    - cron: '17 4 * * *'
      timezone: Europe/Rome
    - cron: '27 5 * * *'
      timezone: Europe/Rome
  workflow_dispatch:
    inputs:
      recover_missing_fixtures:
        description: Recupera solo fixture mancanti dopo un A/C riuscito oggi; manutenzione ripetibile
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  nightly-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Europe/Rome
      SYNC_TIMEZONE: Europe/Rome
      # Preserve the originating timezone-aware trigger even after queue delay.
      SCHEDULE_CRON: ${{ github.event.schedule }}
      RECOVER_MISSING_FIXTURES: ${{ inputs.recover_missing_fixtures || 'false' }}
      PORT: '3001'
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PLAYER_AVAILABILITY_ENABLED: 'false'
      PLAYER_DATA_ENABLED: 'false'
      API_FOOTBALL_ENABLED: 'false'
      # Informational collection stays off; essential nightly snapshots share the credit budget.
      RUN_ODDS_SYNC: 'false'
      ODDS_INFORMATIONAL_NETWORK_ENABLED: 'false'
      # A keeps the app's event markets; all requests still share the persistent credit budget.
      ODDS_EXTRA_EVENT_NETWORK_ENABLED: 'true'
      RUN_TRANSITION_REFERENCE_SYNC: 'true'
      ODDS_SYNC_COMPETITIONS: "Serie A|Premier League|La Liga|Bundesliga|Ligue 1"
      UNDERSTAT_SYNC_TIMEOUT_SECONDS: '3600'
      FOOTBALL_DATA_TIMEOUT_SECONDS: '2400'
      TRANSITION_REFERENCE_TIMEOUT_SECONDS: '600'
      API_FOOTBALL_TIMEOUT_SECONDS: '120'
      PREDICTIONS_SETTLEMENT_TIMEOUT_SECONDS: '180'
      ODDS_SYNC_TIMEOUT_SECONDS: '300'
      CALIBRATION_WARM_TIMEOUT_SECONDS: '600'
      LEARNING_SYNC_TIMEOUT_SECONDS: '600'
      FINAL_STATUS_TIMEOUT_SECONDS: '120'
      # Remote activation requires a separate, explicit confirmation after cutover.
      RESEARCH_NIGHTLY_ENABLED: ${{ vars.RESEARCH_NIGHTLY_ENABLED || 'false' }}
      RESEARCH_NIGHTLY_RECOMMENDATION_ENABLED: ${{ vars.RESEARCH_NIGHTLY_RECOMMENDATION_ENABLED || 'false' }}
      RESEARCH_NIGHTLY_MINUTE: '7'
      RESEARCH_NIGHTLY_TIMEOUT_SECONDS: '1200'
      RESEARCH_NIGHTLY_QUOTE_MAX_AGE_SECONDS: '300'
      RESEARCH_NIGHTLY_MIN_EV: '0.04'
      RESEARCH_NIGHTLY_MIN_PRUDENTIAL_EV: '0.01'
      # Retired automation cannot run alongside the finite nightly A/C job.
      RESEARCH_T15_SCHEDULER_ENABLED: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check daily execution before installation or database access
        id: nightly_guard
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node backend/scripts/nightly-schedule-guard.js

      - name: Install backend dependencies
        if: steps.nightly_guard.outputs.run == 'true'
        working-directory: backend
        run: npm ci

      - name: Build backend
        if: steps.nightly_guard.outputs.run == 'true'
        working-directory: backend
        run: npm run build

      - name: Run nightly sync
        if: steps.nightly_guard.outputs.run == 'true'
        env:
          NIGHTLY_GUARD_PASSED: 'true'
          NIGHTLY_GUARD_DAY: ${{ steps.nightly_guard.outputs.day }}
        run: bash scripts/ci/nightly-sync.sh

      - name: Confirm enabled A/C completion
        if: success() && steps.nightly_guard.outputs.run == 'true' && vars.RESEARCH_NIGHTLY_ENABLED == 'true' && vars.RESEARCH_NIGHTLY_RECOMMENDATION_ENABLED == 'true'
        run: echo "Enabled A/C nightly completed after all required data gates."

      - name: Upload backend sync log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-nightly-sync-log
          path: backend-nightly-sync.log
          if-no-files-found: ignore
