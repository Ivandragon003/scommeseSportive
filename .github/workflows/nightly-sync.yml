name: Nightly Sync

on:
  schedule:
    # Obiettivo: 03:00 ora di Roma (partite finite, dati completi).
    # Due trigger per coprire ora legale/solare; il gate EXPECTED_LOCAL_HOUR
    # in nightly-sync.sh fa girare solo quello che cade davvero alle 03:00 Roma.
    - cron: '0 1 * * *'   # 03:00 Roma d'estate (UTC+2)
    - cron: '0 2 * * *'   # 03:00 Roma d'inverno (UTC+1)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  nightly-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Europe/Rome
      SYNC_TIMEZONE: Europe/Rome
      EXPECTED_LOCAL_HOUR: '03'
      # github.event.schedule identifica quale dei due cron ha avviato il run,
      # anche quando GitHub Actions lo esegue in ritardo.
      SCHEDULE_CRON: ${{ github.event.schedule }}
      PORT: '3001'
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_ENABLED: 'true'
      RUN_ODDS_SYNC: 'true'
      RUN_TRANSITION_REFERENCE_SYNC: 'true'
      ODDS_SYNC_COMPETITIONS: "Serie A|Premier League|La Liga|Bundesliga|Ligue 1"
      UNDERSTAT_SYNC_TIMEOUT_SECONDS: '3600'
      FOOTBALL_DATA_TIMEOUT_SECONDS: '2400'
      TRANSITION_REFERENCE_TIMEOUT_SECONDS: '600'
      API_FOOTBALL_TIMEOUT_SECONDS: '120'
      PREDICTIONS_SETTLEMENT_TIMEOUT_SECONDS: '180'
      ODDS_SYNC_TIMEOUT_SECONDS: '300'
      AUTO_BET_TIMEOUT_SECONDS: '900'
      LEARNING_SYNC_TIMEOUT_SECONDS: '600'
      FINAL_STATUS_TIMEOUT_SECONDS: '120'
      AUTO_BET_ENABLED: 'true'
      # Registra nel budget interno le prime 3 opportunita HIGH/MEDIUM per
      # partita; le altre HIGH/MEDIUM, LOW e SPECULATIVE restano simulate.
      # Non effettua puntate su siti bookmaker esterni.
      AUTO_BET_DRY_RUN: 'false'
      AUTO_BET_USER_ID: 'user1'
      AUTO_BET_WINDOW_HOURS: '24'
      AUTO_BET_MAX_MATCHES: '100'
      AUTO_BET_MAX_OPERATIONAL_BETS_PER_MATCH: '3'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run nightly sync
        run: bash scripts/ci/nightly-sync.sh

      - name: Upload backend sync log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-nightly-sync-log
          path: backend-nightly-sync.log
          if-no-files-found: ignore
