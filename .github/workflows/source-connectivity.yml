name: Source connectivity diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check public sources without credentials or database writes
        shell: bash
        run: |
          node <<'NODE'
          const dns = require('node:dns').promises;
          const https = require('node:https');
          async function probe(host, path, requireCalendar = false) {
            try { console.log(JSON.stringify({host, dns:await dns.lookup(host,{all:true})})); }
            catch(error) { console.log(JSON.stringify({host,dnsError:error.code})); }
            return new Promise(resolve=>{
              const started=Date.now();
              const request=https.get({hostname:host,path,headers:{'X-Requested-With':'XMLHttpRequest','User-Agent':'FootballPredictor connectivity diagnostic','Accept':'application/json'}},response=>{
                const statusOk=response.statusCode>=200 && response.statusCode<300;
                if(!requireCalendar) {
                  console.log(JSON.stringify({host,path,status:response.statusCode,durationMs:Date.now()-started}));
                  response.destroy(); resolve(statusOk); return;
                }
                let body='', bytes=0;
                response.setEncoding('utf8');
                response.on('data',chunk=>{
                  bytes+=Buffer.byteLength(chunk);
                  if(bytes>4*1024*1024) { request.destroy(Object.assign(new Error('response_limit'),{code:'RESPONSE_TOO_LARGE'})); return; }
                  body+=chunk;
                });
                response.on('error',()=>resolve(false));
                response.on('aborted',()=>resolve(false));
                response.on('end',()=>{
                  let payload;
                  try { payload=JSON.parse(body); } catch { /* HTML is not a calendar, even with HTTP 200. */ }
                  const validCalendar=!!payload && !Array.isArray(payload) && Array.isArray(payload.dates);
                  const available=statusOk && validCalendar && payload.dates.length>0;
                  console.log(JSON.stringify({host,path,status:response.statusCode,contentType:response.headers['content-type']??null,
                    validCalendar,matches:validCalendar?payload.dates.length:null,available,durationMs:Date.now()-started}));
                  resolve(available);
                });
              });
              const timer=setTimeout(()=>request.destroy(Object.assign(new Error('deadline'),{code:'ETIMEDOUT'})),12000);
              request.on('close',()=>clearTimeout(timer));
              request.on('error',error=>{console.log(JSON.stringify({host,path,error:error.code,durationMs:Date.now()-started}));resolve(false);});
            });
          }
          (async()=>{
            const now=new Date(), year=now.getUTCFullYear()-(now.getUTCMonth()<6?1:0);
            const coverage=[];
            for(const league of ['serie_a','epl','la_liga','bundesliga','ligue_1']) {
              coverage.push({league,available:await probe('understat.com',`/getLeagueData/${league}/${year}`,true)});
            }
            const reachable=coverage.every(item=>item.available);
            const season=String(year).slice(-2)+String(year+1).slice(-2);
            const supplemental=await probe('www.football-data.co.uk',`/mmz4281/${season}/I1.csv`);
            console.log(JSON.stringify({understatReachable:reachable,understatCoverage:coverage,supplementalReachable:supplemental}));
            if(!reachable) process.exitCode=1;
          })().catch(error=>{console.error(error.code||error.name);process.exitCode=1;});
          NODE
