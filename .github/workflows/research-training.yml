name: Weekly research training

on:
  schedule:
    - cron: '30 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: UTC
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      RESEARCH_T15_SCHEDULER_ENABLED: 'false'
      PLAYER_DATA_ENABLED: 'false'
      PLAYER_AVAILABILITY_ENABLED: 'false'
      ODDS_INFORMATIONAL_NETWORK_ENABLED: 'false'
      ODDS_EXTRA_EVENT_NETWORK_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt
      - run: npm ci
      - run: python -m pip install -r ml/requirements.txt
      - run: npm run build
      - name: Verify chronological ML and coherent probability implementations
        run: python -m unittest discover -s ml/tests -v
      - name: Verify controlled adoption and rollback
        run: node --test test/challenger-adoption.test.js test/research-lifecycle.test.js
      - name: Export all eligible leagues without production writes
        run: node scripts/research.js export --out artifacts/research/matches.json
      - name: Build Nightly-aligned development features and controlled C candidates
        shell: bash
        run: |
          AS_OF="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          node scripts/build-challenger-dataset-parallel.js --matches artifacts/research/matches.json --asof "$AS_OF" --out artifacts/research/dataset.json --workers 2
          python ml/train.py --input artifacts/research/dataset.json --output artifacts/research/training --experiment controlled-challenger --iterations 120 --depth 3 --folds 3
          node scripts/research-lifecycle.js finalize-coherent --artifact artifacts/research/training/artifact.json --report artifacts/research/training/report.json --out artifacts/research/training/coherent --mode isotonic_1x2
      - name: Preregister selected C deployment without adoption from development scores
        if: vars.RESEARCH_REGISTRY_WRITES_ENABLED == 'true'
        run: node scripts/research-lifecycle.js register-candidate --artifact artifacts/research/training/coherent/artifact.json --dataset artifacts/research/dataset.json --selector payout-aware-v1
      - name: Review frozen future evidence and measured C deployment health
        if: vars.RESEARCH_REGISTRY_WRITES_ENABLED == 'true'
        run: node scripts/research-lifecycle.js review-challenger
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research-training-${{ github.run_id }}
          path: backend/artifacts/research/training/
          if-no-files-found: warn
          retention-days: 30
