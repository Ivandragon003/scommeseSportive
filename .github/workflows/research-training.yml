name: Weekly research training

on:
  schedule:
    - cron: '30 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: UTC
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      RESEARCH_T15_SCHEDULER_ENABLED: 'false'
      PLAYER_DATA_ENABLED: 'false'
      PLAYER_AVAILABILITY_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt
      - run: npm ci
      - run: python -m pip install -r ml/requirements.txt
      - run: npm run build
      - name: Verify chronological ML and coherent probability implementations
        run: python -m unittest discover -s ml/tests -v
      - name: Export all eligible leagues without production writes
        run: node scripts/research.js export --out artifacts/research/matches.json
      - name: Build chronological features and train candidates
        shell: bash
        run: |
          AS_OF="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          node scripts/research.js dataset --input artifacts/research/matches.json --out artifacts/research/dataset.json --asof "$AS_OF"
          node scripts/research.js train --input artifacts/research/dataset.json --out artifacts/research/training
          node scripts/research-lifecycle.js finalize-coherent --artifact artifacts/research/training/artifact.json --report artifacts/research/training/report.json --out artifacts/research/training/coherent --mode identity
      - name: Register candidate and apply evidence gates
        if: vars.RESEARCH_REGISTRY_WRITES_ENABLED == 'true'
        run: node scripts/research-lifecycle.js register --artifact artifacts/research/training/coherent/artifact.json --report artifacts/research/training/coherent/report.json --dataset artifacts/research/dataset.json
      - name: Check measured champion health and rollback if necessary
        if: vars.RESEARCH_REGISTRY_WRITES_ENABLED == 'true'
        run: node scripts/research-lifecycle.js rollback-health
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research-training-${{ github.run_id }}
          path: backend/artifacts/research/training/
          if-no-files-found: warn
          retention-days: 30
