name: Nightly virtual betting watchdog

# Replaces the retired T-15 heartbeat monitor. Missing-run alerts are opt-in.
on:
  schedule:
    - cron: '37 * * * *'
  workflow_run:
    workflows: ['Nightly Sync']
    types: [completed]
  workflow_dispatch:
    inputs:
      expect_enabled:
        description: Require a measured nightly decision run (never a worker heartbeat)
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: research-watchdog
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Check GitHub nightly execution independently of Hostless and Turso
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEARCH_NIGHTLY_MONITOR_ENABLED: ${{ inputs.expect_enabled || vars.RESEARCH_NIGHTLY_MONITOR_ENABLED || 'false' }}
          RESEARCH_NIGHTLY_ACKNOWLEDGED_ORPHAN_RUN_IDS: ${{ vars.RESEARCH_NIGHTLY_ACKNOWLEDGED_ORPHAN_RUN_IDS || '' }}
        run: node scripts/check-research-nightly.js --github-only
      - uses: actions/setup-node@v5
        if: ${{ always() && vars.RESEARCH_NIGHTLY_DB_MONITOR_ENABLED == 'true' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        if: ${{ always() && vars.RESEARCH_NIGHTLY_DB_MONITOR_ENABLED == 'true' }}
      - run: npm run build
        if: ${{ always() && vars.RESEARCH_NIGHTLY_DB_MONITOR_ENABLED == 'true' }}
      - name: Read shared database without contacting the backend or odds provider
        if: ${{ always() && vars.RESEARCH_NIGHTLY_DB_MONITOR_ENABLED == 'true' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          # Dedicated read-only token. Never silently fall back to the write token.
          TURSO_WATCHDOG_READONLY_TOKEN: ${{ secrets.TURSO_WATCHDOG_READONLY_TOKEN }}
          ODDS_API_ACCOUNT_SCOPE: ${{ vars.ODDS_API_ACCOUNT_SCOPE || 'primary' }}
          RESEARCH_NIGHTLY_MINUTE: '7'
          RESEARCH_NIGHTLY_EXPECT_ENABLED: ${{ inputs.expect_enabled || vars.RESEARCH_NIGHTLY_MONITOR_ENABLED || 'false' }}
        shell: bash
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "Missing database URL"; exit 1; }
          test -n "$TURSO_WATCHDOG_READONLY_TOKEN" || { echo "Missing dedicated read-only watchdog token; no write-token fallback"; exit 1; }
          node scripts/check-research-nightly.js --database-only

  model_a_inspect:
    # Independent job: it can detect a collector that never started.
    if: vars.MODEL_A_PROSPECTIVE_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Inspect Model A independently using the dedicated read-only token
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_WATCHDOG_READONLY_TOKEN }}
          MODEL_A_PROSPECTIVE_MONITORING_ENABLED: 'true'
          MODEL_A_COLLECTION_PROTOCOL_ID: ${{ vars.MODEL_A_COLLECTION_PROTOCOL_ID }}
          MODEL_A_COLLECTION_MANIFEST_SHA256: ${{ vars.MODEL_A_COLLECTION_MANIFEST_SHA256 }}
        shell: bash
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "Missing database URL"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing dedicated read-only watchdog token; no write-token fallback"; exit 1; }
          node scripts/check-model-a-prospective.js --configured-database
