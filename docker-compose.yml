services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: football-predictor-backend:current
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Rome}
      PORT: 3001
      # GitHub Actions owns the full nightly; do not duplicate it locally.
      # Explicit values override older scheduler flags in .env.
      NIGHTLY_ORCHESTRATOR: github_actions
      AUTO_SYNC_ON_BOOT: "false"
      UNDERSTAT_SCHEDULER_ENABLED: "false"
      ODDS_SNAPSHOT_SCHEDULER_ENABLED: "false"
      LEARNING_REVIEW_SCHEDULER_ENABLED: "false"
      # Betting runs only in the finite GitHub Actions nightly, never in the web process.
      RESEARCH_T15_SCHEDULER_ENABLED: "false"
      RESEARCH_NIGHTLY_ENABLED: "false"
      RESEARCH_NIGHTLY_RECOMMENDATION_ENABLED: "false"
      AUTO_BET_ENABLED: "false"
      # Lineups are paused to reduce reads and provider calls.
      PLAYER_DATA_ENABLED: ${PLAYER_DATA_ENABLED:-false}
      PLAYER_AVAILABILITY_ENABLED: ${PLAYER_AVAILABILITY_ENABLED:-false}
      LINEUP_REFRESH_SCHEDULER_ENABLED: ${LINEUP_REFRESH_SCHEDULER_ENABLED:-false}
    ports:
      - "3001:3001"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: football-predictor-frontend:current
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
