services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: football-predictor-backend:current
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Rome}
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: football-predictor-frontend:current
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
